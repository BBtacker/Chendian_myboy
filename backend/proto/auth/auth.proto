syntax = "proto3";

package auth;
option go_package = "faceTest/backend/proto/auth";

// 认证服务
service Auth {
  // 用户登录
  rpc Login(LoginReq) returns (LoginResp);
  // 用户注册
  rpc Register(RegisterReq) returns (RegisterResp);
  // 获取用户信息
  rpc GetUser(GetUserReq) returns (UserResp);
  // 更新用户信息
  rpc UpdateUser(UpdateUserReq) returns (UpdateUserResp);
  // 验证Token
  rpc ValidateToken(ValidateTokenReq) returns (ValidateTokenResp);
  // 上传头像
  rpc UploadAvatar(UploadAvatarReq) returns (UploadAvatarResp);
}

message LoginReq {
  string username = 1;
  string password = 2;
}

message LoginResp {
  int64 code = 1;
  string msg = 2;
  string token = 3;
  int64 user_id = 4;
  string username = 5;
  string name = 6;
}

message RegisterReq {
  string username = 1;
  string password = 2;
  string name = 3;
}

message RegisterResp {
  int64 code = 1;
  string msg = 2;
}

message GetUserReq {
  int64 user_id = 1;
}

message UserResp {
  int64 id = 1;
  string username = 2;
  string name = 3;
  string avatar = 4;
  string email = 5;
  string phone = 6;
  int32 gender = 7;
  string birthday = 8;
  string address = 9;
  string role = 10;
  string create_time = 11;
}

message UpdateUserReq {
  int64 user_id = 1;
  string name = 2;
  string password = 3;
  string email = 4;
  string phone = 5;
  int32 gender = 6;
  string birthday = 7;
  string address = 8;
}

message UpdateUserResp {
  int64 code = 1;
  string msg = 2;
}

message ValidateTokenReq {
  string token = 1;
}

message ValidateTokenResp {
  bool valid = 1;
  int64 user_id = 2;
  string username = 3;
  string name = 4;
  string role = 5;
}

message UploadAvatarReq {
  int64 user_id = 1;
  bytes file_data = 2;
  string filename = 3;
}

message UploadAvatarResp {
  int64 code = 1;
  string msg = 2;
  string avatar_url = 3;
}
